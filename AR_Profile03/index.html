<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT ME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <header class="card-header">
            ABOUT ME
        </header>

        <div class="card-body">
            <!-- 上部セクション -->
            <div class="top-section">
                <!-- 左：基本情報と技ちゃん -->
                <div class="grid-item info-item">
                    <div class="info-text-stack">
                        <div class="info-row">
                            <span class="label">名&emsp;&emsp;前：</span>
                            <span class="value">技秀堂 太郎</span>
                        </div>
                        <div class="info-row">
                            <span class="label">出&nbsp;身&nbsp;地：</span>
                            <span class="value">東京都</span>
                        </div>
                        <div class="info-row">
                            <span class="label">血&nbsp;液&nbsp;型：</span>
                            <span class="value">A型</span>
                        </div>
                    </div>
                    <!-- 技ちゃん画像 -->
                    <div class="character-image">
                        <img src="Gichan.gif" alt="技ちゃん"> 
                    </div>
                </div>

                <!-- 右：メッセージ枠 -->
                <div class="grid-item message-item">
                    <div class="item-title">メッセージ</div>
                    <div class="message-inner">
                        <div class="item-content">お気軽になんでもご相談ください！</div>
                    </div>
                </div>
            </div>

            <!-- 下部グリッドセクション（3分割） -->
            <div class="profile-grid">
                <div class="grid-item">
                    <div class="item-title">性格</div>
                    <div class="item-content">真面目</div>
                </div>
                <div class="grid-item">
                    <div class="item-title">好きなたべもの</div>
                    <div class="item-content">とんかつ</div>
                </div>
                <div class="grid-item">
                    <div class="item-title">マイブーム</div>
                    <div class="item-content">DIY</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
